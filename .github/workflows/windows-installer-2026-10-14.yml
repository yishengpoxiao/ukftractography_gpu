name: Windows native installer
on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: NVIDIA CUDA redistribution version (build toolchain only)
        default: '12.9.1'
        required: true
  push:
    branches: [main]
    paths:
      - 'platforms/**'
      - 'ukf/**'
      - 'scripts/build_windows_gpu.ps1'
      - 'scripts/install_cuda_toolkit.ps1'
      - '.github/workflows/windows-installer-2026-10-14.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize x64 MSVC
        shell: pwsh
        run: |
          $VS = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /s /c "`"$VS\Common7\Tools\VsDevCmd.bat`" -no_logo -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }
      - name: Install private CUDA toolchain
        shell: pwsh
        run: ./scripts/install_cuda_toolkit.ps1 -Version '${{ inputs.cuda_version || '12.9.1' }}' -Directory "$env:RUNNER_TEMP/cuda"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build-windows
          key: windows-dependencies-${{ inputs.cuda_version || '12.9.1' }}-${{ hashFiles('platforms/superbuild-2026-10-14/CMakeLists.txt') }}
      - name: Build and package native backend
        shell: pwsh
        run: ./scripts/build_windows_gpu.ps1 -BuildDirectory "$PWD/build-windows" -PackageDirectory "$PWD/package-windows" -Jobs 4
      - name: Validate Windows packaging contracts
        shell: pwsh
        run: |
          python slicer-extension/UKFGPU/Testing/test_platform_runtime.py
          python slicer-extension/UKFGPU/Testing/test_installer.py
          python slicer-extension/UKFGPU/Testing/test_portable_packager.py
      - name: Native CPU execution check
        shell: pwsh
        run: |
          $Binary = "$PWD/package-windows/UKFGPU/UKFGPU/Runtime/bin/UKFTractography_gpu.exe"
          & $Binary --dwiFile UKFTractography/Data/Input/two_tensor.nhdr --maskFile UKFTractography/Data/Input/mask.nhdr --seedsFile UKFTractography/Data/Input/seed.nhdr --tracts "$PWD/package-windows/windows-cpu.vtk" --numTensor 2 --numThreads 2 --seedsPerVoxel 1
          if ($LASTEXITCODE -ne 0) { throw "Native Windows CPU execution failed." }
          if (-not (Test-Path package-windows/windows-cpu.vtk)) { throw "Missing native output." }
      - name: Upload installers and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UKFGPU-Windows-native-${{ inputs.cuda_version || '12.9.1' }}
          if-no-files-found: warn
          path: |
            package-windows/*.zip
            package-windows/*.tar.gz
            package-windows/*.vtk
            build-windows/**/CMakeConfigureLog.yaml
            build-windows/**/CMakeError.log
